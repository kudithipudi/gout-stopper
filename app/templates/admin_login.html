{% extends "base.html" %}
{% block title %}Admin login — GoutStopper{% endblock %}
{% block body %}

<div class="max-w-sm mx-auto">
  <div class="rounded-xl border border-slate-200 bg-white p-6">
    <h1 class="text-xl font-bold tracking-tight">Admin login</h1>
    <p class="text-sm text-slate-500 mt-1">Sign in to manage the gout food list.</p>

    {% if error %}
    <div class="mt-4 rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700">
      Wrong password. Please try again.
    </div>
    {% endif %}

    <form action="{{ prefix }}/admin/login" method="post" class="mt-5 space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <div>
        <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
        <input id="password" name="password" type="password" required autofocus
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <button type="submit"
              class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-white font-semibold transition hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        Sign in
      </button>
    </form>
  </div>
</div>

{% endblock %}
